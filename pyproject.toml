readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.14.3",
    "audioop-lts>=0.2.1",
    "dateparser>=1.4.2",
    "humanize>=4.16.0",
    "imapclient>=3.1.0",
    "py-cord>=2.6.1",
    "python-dotenv>=1.0.1",
    "requests>=2.34.2",
]
